server:
  port: 8080

spring:
  application:
    name: teamflow-hub
  datasource:
    # The database is created automatically if it does not exist.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:teamflow_hub}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:dGVhbWZsb3ctaHViLWRldi1zZWNyZXQta2V5LWNoYW5nZS1tZS0xMjM0NTY3ODkw}
    expiration-minutes: 720
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  upload-dir: ${UPLOAD_DIR:uploads}
  seed:
    admin-email: ${ADMIN_EMAIL:admin@teamflow.local}
    admin-password: ${ADMIN_PASSWORD:Admin@123}
